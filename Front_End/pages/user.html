<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpareWay | Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/noty/3.1.4/noty.css">
    <link href="../css/user.css" rel="stylesheet">
</head>
<body>
<div class="dashboard-wrapper">

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="brand">
            <img src="../img/Screenshot_2025-09-10_at_14.10.28-removebg-preview.png" alt="spareWayLogo">
        </div>
        <a class="nav-link active" data-bs-toggle="tab" href="#allAds">All Ads</a>
<!--        <a class="nav-link" data-bs-toggle="tab"  data-bs-target="#myAds">My Ads</a>-->
<!--        <button class="nav-link" id="myAdsTab" data-bs-toggle="tab" data-bs-target="#myAds" type="button">-->
<!--            My Ads-->
<!--        </button>-->
        <a href="myads.html">My Ads</a>


        <a class="nav-link" data-bs-toggle="tab" href="#favAds">Favorites ❤️</a>
        <button class="btn btn-success mt-auto" id="postAD" data-bs-toggle="modal" data-bs-target="#postAdModal">+ Post Ad</button>
        <button class="btn btn-danger mt-2" id="logoutBtn">Logout</button>
    </div>

    <!-- Main Content -->
    <div class="main-content">

        <!-- Search Card -->
        <div class="search-card">
            <h2>🔍 Find Spare Parts</h2>
            <form id="searchForm" class="row g-3">
                <div class="col-md-4">
                    <input type="text" id="searchKeyword" class="form-control" placeholder="Search by keyword...">
                </div>
                <div class="col-md-2">
                    <select id="searchCategory" class="form-select">

                    </select>
                </div>
                <div class="col-md-2">
                    <select id="searchBrand" class="form-select">
                    </select>
                </div>
                <div class="col-md-2">
                    <select id="searchModel" class="form-select"></select>
                </div>
                <div class="col-md-2">
                    <input type="text" id="searchLocation" class="form-control" placeholder="Location">
                </div>
                <div class="col-md-2 d-grid">
                    <button type="submit" class="btn btn-primary">Search</button>
                </div>
            </form>
        </div>

        <!-- Tabs -->
        <div class="tab-content">
            <div class="tab-pane fade show active" id="allAds">
                <div class="row" id="adsContainer"></div>
            </div>
<!--            <div class="tab-pane fade" id="myAds">-->
<!--                <div class="row" id="myAdsContainer"></div>-->
<!--            </div>-->
            <div class="tab-pane fade" id="favAds">
                <div class="row" id="favAdsContainer"></div>
            </div>
            <div class="tab-pane fade" id="messages">
                <div id="messagesS" class="d-flex flex-column"></div>
                <div class="chat-input">
                    <input type="text" id="chatMessage" placeholder="Type your message...">
                    <button id="sendChat">Send</button>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- Post Ad Modal -->
<div class="modal fade" id="postAdModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title">Post a New Ad</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="adForm" class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Ad Title</label>
                        <input type="text" class="form-control" id="title" placeholder="Enter title" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Price (Rs.)</label>
                        <input type="number" class="form-control" id="price" placeholder="Enter price" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Category</label>
                        <select class="form-select" id="category" required></select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Brand</label>
                        <select class="form-select" id="brand" required></select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Model</label>
                        <select class="form-select" id="model" required></select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Location</label>
                        <input type="text" class="form-control" id="location" placeholder="Enter location" required>
                    </div>
                    <div class="col-md-12">
                        <label class="form-label">Upload Photos</label>
                        <input type="file" class="form-control" id="photos" accept="image/*" multiple required>
                    </div>
                    <div class="col-md-12">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" id="description" rows="3" placeholder="Write a brief description..." required></textarea>
                    </div>
                    <div class="col-12 text-end mt-3">
                        <button type="button" id="postAdData" class="btn btn-success btn-lg">Post Ad</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<!-- Active Ad Details Modal -->
<div class="modal fade" id="activeAdModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg rounded-4">

            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title" id="activeAdTitle">Ad Title</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <!-- Carousel -->
                <div id="activeAdCarousel" class="carousel slide mb-3" data-bs-ride="carousel">
                    <div class="carousel-inner" id="activeAdCarouselInner"></div>
                    <button class="carousel-control-prev" type="button" data-bs-target="#activeAdCarousel" data-bs-slide="prev">
                        <span class="carousel-control-prev-icon"></span>
                    </button>
                    <button class="carousel-control-next" type="button" data-bs-target="#activeAdCarousel" data-bs-slide="next">
                        <span class="carousel-control-next-icon"></span>
                    </button>
                </div>

                <!-- Ad Info -->
                <div class="row">
                    <div class="col-md-6">
                        <p><b>Price:</b> Rs. <span id="activeAdPrice"></span></p>
                        <p><b>Location:</b> <span id="activeAdLocation"></span></p>
                        <p><b>Category:</b> <span id="activeAdCategory"></span></p>
                    </div>
                    <div class="col-md-6">
                        <p><b>Brand:</b> <span id="activeAdBrand"></span></p>
                        <p><b>Model:</b> <span id="activeAdModel"></span></p>
                    </div>
                </div>

                <hr>
                <p><b>Description:</b></p>
                <p id="activeAdDescription"></p>
                <hr>
                <p><b>Seller Info:</b></p>
                <p>Name: <span id="activeAdSellerName"></span></p>
                <p>Email: <span id="activeAdSellerEmail"></span></p>
                <p>Phone: <span id="activeAdSellerPhone"></span></p>
            </div>

        </div>
    </div>
</div>

<!-- Edit Modal -->
<div class="modal fade" id="editAdModal" tabindex="-1" aria-labelledby="editAdLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="editAdLabel">Edit Ad</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="editAdForm">
                    <input type="hidden" id="editAdId">
                    <div class="mb-3">
                        <label for="editTitle" class="form-label">Title</label>
                        <input type="text" class="form-control" id="editTitle" required>
                    </div>
                    <div class="mb-3">
                        <label for="editDescription" class="form-label">Description</label>
                        <textarea class="form-control" id="editDescription" rows="3" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="editPrice" class="form-label">Price</label>
                        <input type="number" class="form-control" id="editPrice" required>
                    </div>
                    <div class="mb-3">
                        <label for="editLocation" class="form-label">Location</label>
                        <input type="text" class="form-control" id="editLocation" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Save Changes</button>
                </form>
            </div>
        </div>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/noty/lib/noty.min.js"></script>
<script src="../js/user.js"></script>
</body>
</html>
