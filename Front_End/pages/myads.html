<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Ads</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/noty/3.1.4/noty.css">
    <link href="../css/myads.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>My Ads</h2>
    <div id="myAdsContainer" class="row g-3">
    </div>
</div>

<!-- View / Edit Modal -->
<div class="modal fade" id="activeAdModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg rounded-4">

            <!-- Header -->
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title" id="userAdTitle">Ad Title</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <!-- Carousel -->
                <div id="userAdCarousel" class="carousel slide mb-3" data-bs-ride="carousel">
                    <div class="carousel-inner" id="userAdCarouselInner"></div>
                    <button class="carousel-control-prev" type="button" data-bs-target="#userAdCarousel" data-bs-slide="prev">
                        <span class="carousel-control-prev-icon"></span>
                    </button>
                    <button class="carousel-control-next" type="button" data-bs-target="#userAdCarousel" data-bs-slide="next">
                        <span class="carousel-control-next-icon"></span>
                    </button>
                </div>

                <!-- Info -->
                <div class="row mb-3">
                    <div class="col-md-6">
                        <p><b>Price:</b> Rs. <span id="userAdPrice"></span></p>
                        <p><b>Location:</b> <span id="userAdLocation"></span></p>
                        <p><b>Category:</b> <span id="userAdCategory"></span></p>
                    </div>
                    <div class="col-md-6">
                        <p><b>Brand:</b> <span id="userAdBrand"></span></p>
                        <p><b>Model:</b> <span id="userAdModel"></span></p>
                    </div>
                </div>

                <hr>
                <p><b>Description:</b></p>
                <p id="userAdDescription"></p>
                <hr>
                <p><b>Seller Info:</b></p>
                <p>Name: <span id="userAdSellerName"></span></p>
                <p>Email: <span id="userAdSellerEmail"></span></p>
                <p>Phone: <span id="userAdSellerPhone"></span></p>

                <!-- Update form -->
                <hr>
                <h5>Edit This Ad</h5>
                <form id="updateAdForm" enctype="multipart/form-data">
                    <input type="hidden" id="updateAdId">

                    <div class="mb-2">
                        <label class="form-label">Title</label>
                        <input type="text" class="form-control" id="updateTitle" required>
                    </div>

                    <div class="mb-2">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" id="updateDescription" required></textarea>
                    </div>

                    <div class="mb-2">
                        <label class="form-label">Price</label>
                        <input type="number" class="form-control" id="updatePrice" required>
                    </div>

                    <div class="mb-2">
                        <label class="form-label">Location</label>
                        <input type="text" class="form-control" id="updateLocation" required>
                    </div>

                    <div class="mb-2">
                        <label class="form-label">Category</label>
<!--                        <input type="text" class="form-control" id="updateCategory" required>-->
                        <select class="form-select" id="category" required></select>
                    </div>

                    <div class="mb-2">
                        <label class="form-label">Brand</label>
<!--                        <input type="text" class="form-control" id="updateBrand" required>-->
                        <select class="from-select" id="brand" required></select>
                    </div>

                    <div class="mb-2">
                        <label class="form-label">Model</label>
<!--                        <input type="text" class="form-control" id="updateModel" required>-->
                        <select class="form-select" id="model" required></select>
                    </div>

                    <div class="mb-2">
                        <label class="form-label">Update Photos</label>
                        <input type="file" class="form-control" id="updatePhotos" multiple>
                    </div>

                    <button type="submit" class="btn btn-success">Save Changes</button>
                </form>
            </div>

        </div>
    </div>
</div>

<!-- JS -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/noty/lib/noty.min.js"></script>
<script src="../js/my-ads.js"></script>
<script src="../js/user.js"></script>

</body>
</html>
